<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Civ VI Live Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#14161a; --panel:#1b1e24; --line:#2c3038; --fg:#d7dae0; --dim:#8b919c; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, Segoe UI, sans-serif; display:flex; flex-direction:column; }
  header { padding:10px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  #status { color:var(--dim); font-size:13px; margin-left:auto; }
  main { flex:1; min-height:0; display:flex; }
  #logpane { flex:1 1 55%; min-width:0; overflow-y:auto; padding:16px 20px; }
  #log { max-width:820px; margin:0 auto; }
  #boardpane { flex:1 1 45%; min-width:0; overflow:auto; padding:16px 20px; background:var(--panel); border-left:1px solid var(--line); }
  #board { margin:0; font:14px/1.45 Consolas, Menlo, monospace; white-space:pre; }
  .turn { margin:24px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); color:#fff; font-size:20px; font-weight:600; }
  .row { margin:8px 0; display:flex; gap:10px; align-items:baseline; }
  .badge { flex:none; min-width:84px; text-align:center; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:4px; color:#101216; background:#9aa0aa; }
  .text { white-space:pre-wrap; overflow-wrap:anywhere; }
  .k-plan{background:#6cb2f0}.k-read{background:#8fd3c4}.k-decision{background:#f0c36c}.k-reaction{background:#f09a6c}
  .k-lesson{background:#a6e07a}.k-pivot{background:#e87a9a}.k-postmortem{background:#c39af0}.k-turn{background:#b0b6c0}
  .k-event{background:#f0e26c}.k-action{background:#7a8ce0}.k-load{background:#6c7480}.k-game{background:#e0e0e0}
  .empty { color:var(--dim); }
</style>
</head>
<body>
<header><h1 id="head">Civ VI Live Log</h1><span id="status">connecting</span></header>
<main>
  <section id="logpane"><div id="log"><div class="empty" id="empty">Waiting for the first entry.</div></div></section>
  <aside id="boardpane"><pre id="board">No board yet.</pre></aside>
</main>
<script>
(function () {
  var next = 0, lastTurn = null, game = null, stick = true;
  var pane = document.getElementById("logpane"), log = document.getElementById("log");
  var statusEl = document.getElementById("status");

  pane.addEventListener("scroll", function () {
    stick = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 40;
  });

  function setGame(g) {
    if (g === game) return;
    game = g;
    var name = g || "no game yet";
    document.title = "Civ VI Live Log - " + name;
    document.getElementById("head").textContent = "Civ VI Live Log - " + name;
  }

  function addRow(r) {
    if (r.turn !== undefined && r.turn !== null && r.turn !== lastTurn) {
      lastTurn = r.turn;
      var t = document.createElement("div");
      t.className = "turn";
      t.textContent = "## Turn " + r.turn;
      log.appendChild(t);
    }
    var row = document.createElement("div"), b = document.createElement("span"), x = document.createElement("span");
    row.className = "row";
    b.className = "badge k-" + String(r.kind).replace(/[^a-z]/g, "");
    b.textContent = r.kind;
    x.className = "text";
    x.textContent = r.text;
    row.appendChild(b); row.appendChild(x);
    log.appendChild(row);
  }

  function pollLog() {
    return fetch("/api/broadcast?after=" + next).then(function (res) { return res.json(); }).then(function (d) {
      setGame(d.game);
      if (d.next < next) { next = 0; lastTurn = null; log.textContent = ""; return; }
      if (d.rows.length) {
        var e = document.getElementById("empty");
        if (e) e.remove();
        d.rows.forEach(addRow);
        next = d.next;
        if (stick) pane.scrollTop = pane.scrollHeight;
      }
      statusEl.textContent = "live, " + next + " entries";
    });
  }

  function pollBoard() {
    return fetch("/api/board").then(function (res) { return res.json(); }).then(function (d) {
      var el = document.getElementById("board");
      var txt = d.text || "No board yet.";
      if (el.textContent !== txt) el.textContent = txt;
    });
  }

  function tick() {
    Promise.all([pollLog(), pollBoard()]).catch(function () {
      statusEl.textContent = "disconnected, retrying";
    }).then(function () { setTimeout(tick, 2000); });
  }
  tick();
})();
</script>
</body>
</html>
